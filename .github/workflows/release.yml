name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      # runner 自带 gh CLI，注入 GH_TOKEN：每次 tag 推送都强制重建 Release 并附最新 APK
      # （避免旧的隐藏 release 干扰：先删除再创建，始终产出全新可见的 Release）
      - name: 重建 GitHub Release（强制）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          apk_name="WoZai-v${version}.apk"
          ref="${{ github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk "../$apk_name"
          cd ..
          gh release delete "$ref" --yes 2>/dev/null || true
          gh release create "$ref" "$apk_name" --title "WoZai $ref (v${version})" --generate-notes